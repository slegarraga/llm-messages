name: Bug report
description: Report a conversion or response normalization that produces the wrong output
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal input payload makes a bug fixable.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of llm-messages?
      placeholder: 0.5.2
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Affected path
      description: Which conversion or normalizer is affected?
      options:
        - openai -> anthropic
        - openai -> gemini
        - anthropic -> openai
        - gemini -> openai
        - convert() between two providers
        - response normalization
        - other
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input payload
      description: The conversation or response body you passed in.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected to get, and what you got instead.
    validations:
      required: true
